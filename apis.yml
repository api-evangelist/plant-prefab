name: Plant Prefab
description: Plant Prefab is a Southern California offsite construction technology
  company that custom-fabricates panelized and modular building components to deliver
  housing and hospitality projects in roughly half the time of traditional site-built
  construction. Its panel-based building system spans open-cavity panels to fully
  finished modules, and its LivingHomes product line and in-house Plant Design Studio
  offer customized, sustainable designs recognized with LEED Platinum, NAHB Energy
  Value Housing, and AIA Top Ten Green Projects awards. The company is backed by
  Obvious Ventures and does not currently publish a public developer API.
